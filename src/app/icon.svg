<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="32" height="32">
  <!--
    The STOCKX brand mark, as the browser tab.

    Geometry copied verbatim from `BrandMark` in
    `src/components/layout/wordmark.tsx` — same viewBox, same three rects, same
    opacity ramp. If the logo changes, change it there and mirror it here and
    in `scripts/generate-favicon.mjs`.

    Colour is the one deliberate difference. In the app the mark is
    `currentColor`, which resolves to near-black on the light theme and
    near-white on the dark one; a favicon has no such context, and either ink
    would vanish into one of the two tab strips it might land on. It uses the
    brand accent instead — the same `--accent` token the app defines, picked
    per colour scheme below, which reads on both.
  -->
  <style>
    :root { --mark: #8E6330; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #D4A65E; }
    }
  </style>

  <rect x="2" y="4" width="3" height="12" rx="1.5" fill="var(--mark, #B8863F)" />
  <rect x="8" y="1" width="3" height="18" rx="1.5" fill="var(--mark, #B8863F)" opacity="0.45" />
  <rect x="14" y="7" width="3" height="9" rx="1.5" fill="var(--mark, #B8863F)" opacity="0.7" />
</svg>
